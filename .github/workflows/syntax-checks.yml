name: CivicLens prototype syntax checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile edge Python client
        run: python -m compileall -q cctv-device
      - name: Check Node server syntax
        run: node --check admin-dashboard/server-lite.js
